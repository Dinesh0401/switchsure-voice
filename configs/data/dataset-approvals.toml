[[dataset]]
id = "custom-tamil-english-2026"
title = "Controlled-access Tamil-English corpus described by Sangeetha et al. (2026)"
version = "paper-description-only"
decision = "conditional"
permitted_uses = []
conditions = [
  "Receive institutional approval and execute the data-use agreement.",
  "Inspect consent, anonymization, speaker/session keys, allowed purposes, and redistribution restrictions.",
  "Pin the delivered artifact and create a four-way speaker/session-disjoint split.",
]
evidence = ["https://doi.org/10.1186/s13636-026-00477-y"]
rationale = "The paper describes real consented Tamil-English speech, but access is controlled and no DUA or artifact is available in this workspace."
