[project]
name = "switchsure-api"
version = "0.1.0"
description = "Typed FastAPI delivery layer for SwitchSure"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "switchsure-core",
  "uvicorn[standard]>=0.34,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/switchsure_api"]

[tool.uv.sources]
switchsure-core = { workspace = true }
