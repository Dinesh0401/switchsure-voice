[project]
name = "switchsure-eval"
version = "0.1.0"
description = "Reproducible risk-aware evaluation for SwitchSure"
requires-python = ">=3.12,<3.15"
dependencies = ["switchsure-ml"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/switchsure_eval"]
